<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You | LayerLab Print Farm</title>
<link rel="icon" type="image/svg+xml" href="assets/layerlab-icon.svg">
<link rel="icon" type="image/png" href="assets/layerlab-icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#0f9d58;--accent-dark:#0b7a44;--accent-soft:#e7f6ee;--ink:#111418;--muted:#5d6670;--line:#e6e8eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#f6f7f8;min-height:100vh;display:grid;place-items:center;padding:16px}
  .box{background:#fff;border:1px solid var(--line);border-radius:28px;padding:48px 36px;max-width:520px;text-align:center;box-shadow:0 10px 30px rgba(17,20,24,.08)}
  .tick{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 22px;font-size:2rem;font-weight:700}
  h1{font-size:2rem;letter-spacing:-.02em;margin-bottom:12px}
  h1 em{font-style:normal;color:var(--accent)}
  p{color:var(--muted);line-height:1.6;margin-bottom:28px}
  a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:12px 26px;border-radius:999px}
  a:hover{background:var(--accent-dark)}
</style>
</head>
<body>
  <div class="box">
    <div class="tick">✓</div>
    <h1>Request <em>received!</em></h1>
    <p>Thanks for sending your project. We'll check your file and email you a price and lead time within 24 hours.</p>
    <a href="index.html">Back to home</a>
  </div>
</body>
</html>
